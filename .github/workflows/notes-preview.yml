# A preview with the ainotelayer notes layer, only when someone asks for it.
# Run it from the Actions tab with a pull request number. It builds that pull
# request the way deploy-to-firebase.yml does, adds the notes layer, and
# deploys to a Firebase channel of its own (notes-pr-<number>), so the ordinary
# preview of the pull request is not touched.
#
# Notes are comments on the pull request, so running this again after new
# pushes gives a fresh preview with the same notes.
#
# The steps marked "same as deploy-to-firebase.yml" are copied from it and have
# to follow it when it changes.
#
# GitHub only offers manually run workflows that exist on the default branch,
# so this has to be merged to master before it can be used on any branch.
name: slim/notes-preview

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to build. Its notes are kept as comments on it.
        required: true
        type: number
      expires:
        description: How long the preview stays up, for example 7d (30d at most)
        default: 7d
        type: string
      source_locations:
        description: Tag elements with their source file and line (Vite builds only)
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: notes-preview-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  notes-preview:
    name: "Preview with notes"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Look up the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --json state,isCrossRepository,headRefName,headRefOid > "${RUNNER_TEMP}/pr.json"
          # The build uses repository secrets, so it only runs code from this repository.
          if [ "$(jq -r .isCrossRepository "${RUNNER_TEMP}/pr.json")" = "true" ]; then
            echo "::error::Pull request #${PR_NUMBER} comes from a fork and is not built here."
            exit 1
          fi
          {
            echo "head_ref=$(jq -r .headRefName "${RUNNER_TEMP}/pr.json")"
            echo "head_sha=$(jq -r .headRefOid "${RUNNER_TEMP}/pr.json")"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      # --- same as deploy-to-firebase.yml ---------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      # Preparing a git DMV dependency runs a nested pnpm install that ignores
      # this workspace's allowBuilds (e.g. @parcel/watcher).
      - name: Allow dependency build scripts
        run: pnpm config set strict-dep-builds false --global

      # Same script as deploy-to-firebase.yml; the pull request's description
      # and branch come from the lookup above instead of the event.
      - name: Resolve DMV branch for preview
        id: dmv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          PR_BODY="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
          export PR_BODY
          ./scripts/resolve-dmv-preview-branch.sh

      - name: Install dependencies
        # Install without lifecycle scripts, then rebuild only packages that need prepare
        # (dicom-microscopy-viewer dist/). Keeps Sonar happy while still building DMV.
        env:
          DMV_USE_GIT: ${{ steps.dmv.outputs.use_git }}
          DMV_REF: ${{ steps.dmv.outputs.ref }}
          DMV_SHA: ${{ steps.dmv.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${DMV_USE_GIT}" = "true" ]; then
            case "${DMV_REF}" in
              ''|*[!A-Za-z0-9._/-]*|.*|*.)
                echo "::error::Unsafe DMV_REF rejected"
                exit 1
                ;;
            esac
            pnpm pkg set 'dependencies["dicom-microscopy-viewer"]'"=github:ImagingDataCommons/dicom-microscopy-viewer#${DMV_REF}"
            # Dynamically allow builds for the resolved tarball URL so pnpm's
            # dependency status check passes during `pnpm run build`
            TARBALL_KEY="dicom-microscopy-viewer@https://codeload.github.com/ImagingDataCommons/dicom-microscopy-viewer/tar.gz/${DMV_SHA}"
            node -e "
              const fs = require('fs');
              const content = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
              // Insert the tarball allowBuilds entry after 'dicom-microscopy-viewer: true'
              const updated = content.replace(
                /(allowBuilds:[\s\S]*?dicom-microscopy-viewer: true)/,
                \"\$1\\n  '\" + process.argv[1] + \"': true\"
              );
              fs.writeFileSync('pnpm-workspace.yaml', updated);
            " "${TARBALL_KEY}"
            pnpm install --no-frozen-lockfile --ignore-scripts
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
          # allowBuilds in pnpm-workspace.yaml: core-js(+pure) and dicom-microscopy-viewer
          pnpm rebuild dicom-microscopy-viewer core-js core-js-pure
          # Build DMV if dist files are missing (git dependency in package.json)
          if [ ! -f "node_modules/dicom-microscopy-viewer/dist/dynamic-import/dicomMicroscopyViewer.min.js" ]; then
            echo "DMV dist files missing - building from git dependency"
            (cd node_modules/dicom-microscopy-viewer && pnpm run build)
          fi

      - name: Require preview DICOMweb URL
        env:
          SLIM_PREVIEW_DICOMWEB_URL: ${{ secrets.SLIM_PREVIEW_DICOMWEB_URL }}
        run: |
          if [ -z "${SLIM_PREVIEW_DICOMWEB_URL}" ]; then
            echo "::error::Set Actions secret SLIM_PREVIEW_DICOMWEB_URL (used by public/config/preview.js via window.slim.env)."
            exit 1
          fi
      # --- end of the copied steps ------------------------------------------

      # Wraps the Vite config from outside so elements carry their source file
      # and line; nothing in this repository changes. Does nothing on a
      # branch that is not built with Vite.
      - name: Prepare source locations
        id: stamp
        if: inputs.source_locations
        uses: igoroctaviano/ainotelayer/stamp@076aa153aca6dc660067a4ff59c2224a59553153 # main, 2026-11-17

      - name: Build
        env:
          REACT_APP_CONFIG: preview
          PUBLIC_URL: /
          SLIM_PREVIEW_DICOMWEB_URL: ${{ secrets.SLIM_PREVIEW_DICOMWEB_URL }}
          REACT_APP_DMV_GIT_SHA: ${{ steps.dmv.outputs.sha }}
          STAMP_CONFIG: ${{ steps.stamp.outputs.config }}
        run: |
          extra=()
          if [ -n "${STAMP_CONFIG:-}" ]; then
            extra=(--config "${STAMP_CONFIG}" --configLoader native)
          fi
          pnpm run build "${extra[@]}"

      - name: Add the notes layer
        uses: igoroctaviano/ainotelayer@076aa153aca6dc660067a4ff59c2224a59553153 # main, 2026-11-17
        with:
          dir: build
          app: slim
          pr: ${{ inputs.pr }}
          branch: ${{ steps.pr.outputs.head_ref }}
          sha: ${{ steps.pr.outputs.head_sha }}

      # No repoToken: this deploy does not comment on the pull request or add
      # a check; the overview below carries the link.
      - name: Deploy the notes preview
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SLIM }}"
          projectId: idc-external-006
          # Same pin as deploy-to-firebase.yml
          firebaseToolsVersion: 15.34.0
          channelId: notes-pr-${{ inputs.pr }}
          expires: ${{ inputs.expires }}

      # One comment on the pull request with the preview link and the notes.
      # "unresolved: success" keeps the ainotelayer/notes status informational,
      # so open notes never hold a merge back here.
      - name: Post the notes overview
        uses: igoroctaviano/ainotelayer/summary@076aa153aca6dc660067a4ff59c2224a59553153 # main, 2026-11-17
        with:
          pr: ${{ inputs.pr }}
          preview-url: ${{ steps.deploy.outputs.details_url }}
          unresolved: success

      - name: Summary
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          {
            echo "### Preview with notes for #${PR_NUMBER}"
            echo ""
            echo "${PREVIEW_URL}"
            echo ""
            echo "Right-click anything in the preview to add a note."
          } >> "${GITHUB_STEP_SUMMARY}"
