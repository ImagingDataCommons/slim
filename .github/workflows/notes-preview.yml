# A preview with review notes, only when someone asks for it: Actions -> this
# workflow -> Run workflow, with the pull request's number.
#
# It builds that pull request the way deploy-to-firebase.yml does, adds the
# notes layer, and deploys to a Firebase channel of its own
# (notes-pr-<number>). The pull request's ordinary preview is not touched, and
# nothing here runs on its own.
#
# Reviewers right-click the preview to pin notes; the notes are comments on the
# pull request, so running this again after new pushes gives a fresh preview
# with the same notes.
#
# The ainotelayer steps follow its main branch on purpose, unlike the pinned
# actions here: the tool is still being tried out on this repository and
# changes often. Pin them to a release once it settles.
name: slim/notes-preview

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to build a preview with review notes for
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: notes-preview-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  notes-preview:
    name: "Preview with review notes"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Finds the pull request's commit, branch and description, and refuses
      # pull requests from forks: the build uses repository secrets.
      - name: Look up the pull request
        id: pr
        uses: igoroctaviano/ainotelayer/pull-request@main
        with:
          pr: ${{ inputs.pr }}

      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}

      # --- Copied from deploy-to-firebase.yml; keep the two in step ---------
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      # Preparing a git DMV dependency runs a nested pnpm install that ignores
      # this workspace's allowBuilds (e.g. @parcel/watcher).
      - name: Allow dependency build scripts
        run: pnpm config set strict-dep-builds false --global

      # The description and branch come from the lookup above, not the event
      - name: Resolve DMV branch for preview
        id: dmv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          HEAD_REF: ${{ steps.pr.outputs.ref }}
        run: ./scripts/resolve-dmv-preview-branch.sh

      - name: Install dependencies
        # Install without lifecycle scripts, then rebuild only packages that need prepare
        # (dicom-microscopy-viewer dist/). Keeps Sonar happy while still building DMV.
        env:
          DMV_USE_GIT: ${{ steps.dmv.outputs.use_git }}
          DMV_REF: ${{ steps.dmv.outputs.ref }}
          DMV_SHA: ${{ steps.dmv.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${DMV_USE_GIT}" = "true" ]; then
            case "${DMV_REF}" in
              ''|*[!A-Za-z0-9._/-]*|.*|*.)
                echo "::error::Unsafe DMV_REF rejected"
                exit 1
                ;;
            esac
            pnpm pkg set 'dependencies["dicom-microscopy-viewer"]'"=github:ImagingDataCommons/dicom-microscopy-viewer#${DMV_REF}"
            # Dynamically allow builds for the resolved tarball URL so pnpm's
            # dependency status check passes during `pnpm run build`
            TARBALL_KEY="dicom-microscopy-viewer@https://codeload.github.com/ImagingDataCommons/dicom-microscopy-viewer/tar.gz/${DMV_SHA}"
            node -e "
              const fs = require('fs');
              const content = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
              // Insert the tarball allowBuilds entry after 'dicom-microscopy-viewer: true'
              const updated = content.replace(
                /(allowBuilds:[\s\S]*?dicom-microscopy-viewer: true)/,
                \"\$1\\n  '\" + process.argv[1] + \"': true\"
              );
              fs.writeFileSync('pnpm-workspace.yaml', updated);
            " "${TARBALL_KEY}"
            pnpm install --no-frozen-lockfile --ignore-scripts
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
          # allowBuilds in pnpm-workspace.yaml: core-js(+pure) and dicom-microscopy-viewer
          pnpm rebuild dicom-microscopy-viewer core-js core-js-pure
          # Build DMV if dist files are missing (git dependency in package.json)
          if [ ! -f "node_modules/dicom-microscopy-viewer/dist/dynamic-import/dicomMicroscopyViewer.min.js" ]; then
            echo "DMV dist files missing - building from git dependency"
            (cd node_modules/dicom-microscopy-viewer && pnpm run build)
          fi

      - name: Require preview DICOMweb URL
        env:
          SLIM_PREVIEW_DICOMWEB_URL: ${{ secrets.SLIM_PREVIEW_DICOMWEB_URL }}
        run: |
          if [ -z "${SLIM_PREVIEW_DICOMWEB_URL}" ]; then
            echo "::error::Set Actions secret SLIM_PREVIEW_DICOMWEB_URL (used by public/config/preview.js via window.slim.env)."
            exit 1
          fi
      # --- End of the copied steps -------------------------------------------

      # Lets a note name the source file and line of the element it is on, by
      # wrapping the Vite config from outside. Nothing in this repository
      # changes, and it does nothing for a non-Vite build. Notes work without
      # it, so a failure here does not stop the preview: the build then runs
      # as usual.
      - name: Prepare source locations
        id: stamp
        continue-on-error: true
        uses: igoroctaviano/ainotelayer/stamp@main

      # Same settings as the build in deploy-to-firebase.yml
      - name: Build
        env:
          REACT_APP_CONFIG: preview
          PUBLIC_URL: /
          SLIM_PREVIEW_DICOMWEB_URL: ${{ secrets.SLIM_PREVIEW_DICOMWEB_URL }}
          REACT_APP_DMV_GIT_SHA: ${{ steps.dmv.outputs.sha }}
        run: pnpm run build ${{ steps.stamp.outputs.args }}

      # Adds the notes layer to the built files. The branch and commit are the
      # ones checked out above, so notes link to the source that was built
      # even when the pull request gets new commits during this run.
      - name: Add review notes
        uses: igoroctaviano/ainotelayer@main
        with:
          dir: build
          pr: ${{ inputs.pr }}
          key: pr-${{ inputs.pr }}
          branch: ${{ steps.pr.outputs.ref }}
          sha: ${{ steps.pr.outputs.sha }}

      # No repoToken: this deploy adds no comment or check of its own
      - name: Deploy preview with review notes
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SLIM }}"
          projectId: idc-external-006
          # Same pin as deploy-to-firebase.yml
          firebaseToolsVersion: 15.34.0
          channelId: notes-pr-${{ inputs.pr }}
          # The longest Firebase allows; the default of 7 days is short for a
          # review. Each run starts the 30 days again.
          expires: 30d

      # One comment on the pull request with the preview link and the notes
      - name: Post the notes overview
        uses: igoroctaviano/ainotelayer/summary@main
        with:
          pr: ${{ inputs.pr }}
          preview-url: ${{ steps.deploy.outputs.details_url }}
          status: false
