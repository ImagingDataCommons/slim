name: slim/e2e-visual-regression

# Visual-regression tests for the deck.gl bulk-annotation renderer.
#
# Runs inside the pinned Playwright container so the (SwiftShader) browser
# environment is byte-for-byte identical to the committed Linux baselines under
# e2e/__screenshots__/. See e2e/README.md.
#
# The default target study is fetched from the public IDC proxy, so runs depend
# on that external service; retries (configured in playwright.config.ts) absorb
# cold-start slowness. This check is intentionally not required for merge —
# promote it in branch protection once data is hosted locally for hermetic runs.

on:
  pull_request:
    branches: [master]
    # edited: re-run when the PR body changes (e.g. add/update dmv-branch:)
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual:
    name: "Bulk annotation visual regression"
    # Skip re-run on PR body edit unless the body actually changed (dmv-branch updates)
    if: github.event.action != 'edited' || github.event.changes.body != null
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # Keep this tag in sync with the @playwright/test version in package.json.
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Resolve DMV branch for preview
        id: dmv
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: ./scripts/resolve-dmv-preview-branch.sh

      - name: Install dependencies
        # Dependency build scripts are gated by allowBuilds in pnpm-workspace.yaml.
        # The git-hosted dicom-microscopy-viewer needs its prepare script to build dist/.
        env:
          DMV_USE_GIT: ${{ steps.dmv.outputs.use_git }}
          DMV_REF: ${{ steps.dmv.outputs.ref }}
          DMV_SHA: ${{ steps.dmv.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${DMV_USE_GIT:-}" = "true" ]; then
            case "${DMV_REF}" in
              ''|*[!A-Za-z0-9._/-]*|.*|*.)
                echo "::error::Unsafe DMV_REF rejected"
                exit 1
                ;;
            esac
            pnpm pkg set 'dependencies["dicom-microscopy-viewer"]'"=github:ImagingDataCommons/dicom-microscopy-viewer#${DMV_REF}"
            # Dynamically allow builds for the resolved tarball URL so pnpm's
            # dependency status check passes during `pnpm run build`
            TARBALL_KEY="dicom-microscopy-viewer@https://codeload.github.com/ImagingDataCommons/dicom-microscopy-viewer/tar.gz/${DMV_SHA}"
            node -e "
              const fs = require('fs');
              const content = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
              // Insert the tarball allowBuilds entry after 'dicom-microscopy-viewer: true'
              const updated = content.replace(
                /(allowBuilds:[\s\S]*?dicom-microscopy-viewer: true)/,
                \"\$1\\n  '\" + process.argv[1] + \"': true\"
              );
              fs.writeFileSync('pnpm-workspace.yaml', updated);
            " "${TARBALL_KEY}"
            pnpm install --no-frozen-lockfile --ignore-scripts
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
          # allowBuilds in pnpm-workspace.yaml: core-js(+pure) and dicom-microscopy-viewer
          pnpm rebuild dicom-microscopy-viewer core-js core-js-pure
          # Build DMV if dist files are missing (git dependency in package.json)
          if [ ! -f "node_modules/dicom-microscopy-viewer/dist/dynamic-import/dicomMicroscopyViewer.min.js" ]; then
            echo "DMV dist files missing - building from git dependency"
            (cd node_modules/dicom-microscopy-viewer && pnpm run build)
          fi

      - name: Build (e2e config)
        run: pnpm run build:e2e

      - name: Run visual-regression tests
        # Playwright starts the static server (serve:e2e) itself via the
        # webServer config and compares against the committed baselines.
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
