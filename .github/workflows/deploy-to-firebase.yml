name: slim/deploy-to-firebase

on:
  pull_request:
    branches: [master]
    # edited: re-run when the PR body changes (e.g. add/update dmv-branch:)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-firebase:
    name: "Deploy to Firebase"
    # Forked PRs cannot access the Firebase service account secret, so skip them.
    # On pull_request edited, only re-run when the body changed (dmv-branch updates).
    if: >
      github.event_name == 'push' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'edited' || github.event.changes.body != null)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Disable strict dep builds check globally
        run: |
          pnpm config set strict-dep-builds false --global
          echo "strict-dep-builds=false" >> ~/.npmrc

      - name: Resolve DMV branch for preview
        id: dmv
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: ./scripts/resolve-dmv-preview-branch.sh

      - name: Install dependencies
        # Install without lifecycle scripts, then rebuild only packages that need prepare
        # (dicom-microscopy-viewer dist/). Keeps Sonar happy while still building DMV.
        env:
          DMV_USE_GIT: ${{ steps.dmv.outputs.use_git }}
          DMV_REF: ${{ steps.dmv.outputs.ref }}
          DMV_SHA: ${{ steps.dmv.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${DMV_USE_GIT}" = "true" ]; then
            case "${DMV_REF}" in
              ''|*[!A-Za-z0-9._/-]*|.*|*.)
                echo "::error::Unsafe DMV_REF rejected"
                exit 1
                ;;
            esac
            pnpm pkg set 'dependencies["dicom-microscopy-viewer"]'"=github:ImagingDataCommons/dicom-microscopy-viewer#${DMV_REF}"
            # Dynamically allow builds for the resolved tarball URL so pnpm's
            # dependency status check passes during `pnpm run build`
            TARBALL_KEY="dicom-microscopy-viewer@https://codeload.github.com/ImagingDataCommons/dicom-microscopy-viewer/tar.gz/${DMV_SHA}"
            node -e "
              const fs = require('fs');
              const content = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
              // Insert the tarball allowBuilds entry after 'dicom-microscopy-viewer: true'
              const updated = content.replace(
                /(allowBuilds:[\s\S]*?dicom-microscopy-viewer: true)/,
                \"\$1\\n  '\" + process.argv[1] + \"': true\"
              );
              fs.writeFileSync('pnpm-workspace.yaml', updated);
            " "${TARBALL_KEY}"
            pnpm install --no-frozen-lockfile --ignore-scripts
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
          # allowBuilds in pnpm-workspace.yaml: core-js(+pure) and dicom-microscopy-viewer
          pnpm rebuild dicom-microscopy-viewer core-js core-js-pure
          # Build DMV if dist files are missing (git dependency in package.json)
          if [ ! -f "node_modules/dicom-microscopy-viewer/dist/dynamic-import/dicomMicroscopyViewer.min.js" ]; then
            echo "DMV dist files missing - building from git dependency"
            (cd node_modules/dicom-microscopy-viewer && pnpm run build)
          fi

      - name: Require preview DICOMweb URL
        env:
          SLIM_PREVIEW_DICOMWEB_URL: ${{ secrets.SLIM_PREVIEW_DICOMWEB_URL || vars.SLIM_PREVIEW_DICOMWEB_URL }}
        run: |
          if [ -z "${SLIM_PREVIEW_DICOMWEB_URL}" ]; then
            echo "::error::Set Actions secret or variable SLIM_PREVIEW_DICOMWEB_URL (used by public/config/preview.js via window.slim.env)."
            exit 1
          fi

      - name: Build
        env:
          REACT_APP_CONFIG: preview
          PUBLIC_URL: /
          SLIM_PREVIEW_DICOMWEB_URL: ${{ secrets.SLIM_PREVIEW_DICOMWEB_URL || vars.SLIM_PREVIEW_DICOMWEB_URL }}
          REACT_APP_DMV_GIT_SHA: ${{ steps.dmv.outputs.sha }}
        run: pnpm run build

      - name: Comment DMV status on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DMV_USE_GIT: ${{ steps.dmv.outputs.use_git }}
          DMV_REF: ${{ steps.dmv.outputs.ref }}
          DMV_SHA: ${{ steps.dmv.outputs.sha }}
          DMV_SOURCE: ${{ steps.dmv.outputs.source }}
        run: |
          if [ "${DMV_USE_GIT}" = "true" ]; then
            BODY="$(cat <<EOF
          ## 🔗 Firebase Preview - Linked to DMV Branch

          This preview is using a **linked** \`dicom-microscopy-viewer\` branch:

          | | |
          |---|---|
          | **Branch** | [\`${DMV_REF}\`](https://github.com/ImagingDataCommons/dicom-microscopy-viewer/tree/${DMV_REF}) |
          | **Commit** | [\`${DMV_SHA:0:7}\`](https://github.com/ImagingDataCommons/dicom-microscopy-viewer/commit/${DMV_SHA}) |
          | **Source** | \`${DMV_SOURCE}\` |

          > To change the DMV branch, edit \`dmv-branch: <branch-name>\` in the PR description.
          EOF
          )"
          else
            DMV_VERSION="$(node -p "require('./package.json').dependencies['dicom-microscopy-viewer']")"
            BODY="$(cat <<EOF
          ## 📦 Firebase Preview - Using Published DMV

          This preview is using the **published** \`dicom-microscopy-viewer\` from package.json:

          | | |
          |---|---|
          | **Version** | \`${DMV_VERSION}\` |

          > **To link a DMV branch for testing** (requires an open PR in DMV):
          > - Add \`dmv-branch: <branch-name>\` to the PR description, OR
          > - Use the same branch name in both repos (automatic matching)
          EOF
          )"
          fi
          gh pr comment "${PR_NUMBER}" --body "${BODY}"

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SLIM }}"
          projectId: idc-external-006

      - name: Deploy to live
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SLIM }}"
          projectId: idc-external-006
          channelId: live
