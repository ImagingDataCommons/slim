name: slim/release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach build artifact (e.g., v0.47.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: "Build and attach artifact to release"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Dependency build scripts are gated by allowBuilds in pnpm-workspace.yaml.
        # The git-hosted dicom-microscopy-viewer needs its prepare script to build dist/.
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Zip build
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: zip -r "slim-${TAG}.zip" build

      - name: Upload build artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "${TAG}" "slim-${TAG}.zip" --clobber
