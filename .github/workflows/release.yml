name: slim/release

on:
  push:
    branches:
      - master

# Writes are performed with the RELEASE_GITHUB_TOKEN PAT, not the workflow token.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: "Bump version and cut a release"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Dependency build scripts are gated by allowBuilds in pnpm-workspace.yaml.
        # The git-hosted dicom-microscopy-viewer needs its prepare script to build dist/.
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Zip build
        run: zip -r build.zip build

      - name: Bump version and cut a release
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ vars.RELEASE_GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.RELEASE_GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.RELEASE_GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.RELEASE_GIT_COMMITTER_EMAIL }}
        run: pnpm exec semantic-release --branches master
