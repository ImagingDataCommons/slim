name: website/deploy

on:
  pull_request:
    branches: [master]
    paths:
      - "website/**"
      - "src/styles/tokens.css"
      - "src/components/ui/**"
      - "src/components/slim/**"
      - "docs/CHANGELOG.md"
      - "CITATION.cff"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-website.yml"
  push:
    branches: [master]
    paths:
      - "website/**"
      - "src/styles/tokens.css"
      - "src/components/ui/**"
      - "src/components/slim/**"
      - "docs/CHANGELOG.md"
      - "CITATION.cff"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://slim-viewer.web.app

jobs:
  build:
    name: "Check and build the website"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # The site needs no dependency build scripts, and skipping them avoids
        # building dicom-microscopy-viewer, which only the app uses.
        run: pnpm install --frozen-lockfile --ignore-scripts --filter slim-website...

      - name: Check
        run: pnpm --filter slim-website run check

      - name: Test
        run: pnpm --filter slim-website run test

      - name: Build
        run: pnpm --filter slim-website run build

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  deploy:
    name: "Deploy to Firebase"
    needs: build
    # Forked PRs cannot access the Firebase service account secret, so skip them.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-dist
          path: website/dist

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SLIM }}"
          projectId: idc-external-006
          entryPoint: website
          channelId: website-pr-${{ github.event.pull_request.number }}

      - name: Deploy to live
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SLIM }}"
          projectId: idc-external-006
          entryPoint: website
          channelId: live
