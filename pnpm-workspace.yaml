shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  core-js: true
  core-js-pure: true
  # Allow the git-hosted dicom-microscopy-viewer to run its prepare script,
  # which builds dist/ when installed from a commit tarball. pnpm matches
  # git-hosted packages by their exact tarball URL, so this entry must be
  # updated whenever the dependency pin in package.json changes.
  dicom-microscopy-viewer: true
  dicom-microscopy-viewer@https://codeload.github.com/ImagingDataCommons/dicom-microscopy-viewer/tar.gz/51a7c31c93259f6d710b71eb2155498101571d13: set this to true or false
  'dicom-microscopy-viewer@https://codeload.github.com/ImagingDataCommons/dicom-microscopy-viewer/tar.gz/b0fcc0470e5ed5cb511d8c144404c0f656fbca22': true

overrides:
  '@types/d3-dispatch': 3.0.6
  axios: 1.17.0
  nth-check: 2.0.1
  wrap-ansi: 7.0.0
  make-dir: 3.1.0
  axios>form-data: 4.0.6
  express: 4.21.0
  jsdom>form-data: 3.0.5
  path-to-regexp: 0.1.13
  rollup: 3.30.0
  semver: 7.5.2
  serialize-javascript: 7.0.5
  tar: 7.5.16
  underscore: 1.13.8
