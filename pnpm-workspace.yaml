shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  core-js-pure: true
  dicom-microscopy-viewer: true
  dicom-microscopy-viewer@https://codeload.github.com/ImagingDataCommons/dicom-microscopy-viewer/tar.gz/e800a323390ecf48748903a27e0171a2e4b08ae4: set this to true or false
  dicom-microscopy-viewer@https://codeload.github.com/ImagingDataCommons/dicom-microscopy-viewer/tar.gz/ff48d5e8675a20994974515f6b7090ed9170f3df: true

overrides:
  # Until markup-measurement-labels lands / npm publish; remove after bump
  dicom-microscopy-viewer: github:ImagingDataCommons/dicom-microscopy-viewer#ff48d5e
  '@types/d3-dispatch': 3.0.6
  # Dependabot high: axios inherited-proxy after interceptor cloning
  axios: 1.20.0
  # Dependabot high: adm-zip unbounded memory on crafted ZIP
  adm-zip: 0.6.1
  # Dependabot high: brace-expansion DoS (v1 and v2 lines)
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  # Dependabot high: compression DoS via infinite loop
  compression: 1.8.2
  # Dependabot high: js-yaml quadratic merge-key chains (v3 and v4 lines)
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  # Dependabot high: postcss sourceMappingURL path traversal (no 7.x patch; force 8.x)
  postcss: 8.5.25
  # Dependabot high: nanoid generators can loop indefinitely (GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8)
  nanoid@3: 3.3.19
  # Dependabot critical: proxy-addr unbound CPU during request header parsing
  proxy-addr: 2.0.8
  # Dependabot critical: shell-quote parse() quadratic DoS
  shell-quote: 1.11.0
  # Dependabot high: source-map-js path traversal in sourceRoot
  source-map-js: 1.2.2
  # Dependabot high: fast-uri authority injection & host confusion (CVE-2026-84292, CVE-2026-84394)
  fast-uri: 3.1.8
  # Dependabot high: browserslist RegExp ReDoS
  browserslist: 4.28.7
  nth-check: 2.0.1
  wrap-ansi: 7.0.0
  make-dir: 3.1.0
  axios>form-data: 4.0.6
  express: 4.21.0
  jsdom>form-data: 3.0.5
  path-to-regexp: 0.1.13
  semver: 7.5.2
  serialize-javascript: 7.0.5
  tar: 7.5.16
  underscore: 1.13.8

minimumReleaseAgeExclude:
  - dicom-microscopy-viewer@0.48.23 || 0.48.24 || 0.48.25 || 0.48.26 || 0.48.27 || 0.49.0 || 0.49.1 || 0.49.2
  - dicomweb-client@0.11.3

patchedDependencies:
  # Saving ROIs: dcmjs rejects every valid TrackingIdentifier when building a
  # measurement group (it counts CodedConcept items, and .filter() on the Array
  # subclass calls new TrackingIdentifier(0), which throws). Still in dcmjs latest.
  dcmjs@0.52.0: patches/dcmjs@0.52.0.patch
