shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  dicom-microscopy-viewer: true

overrides:
  '@types/d3-dispatch': 3.0.6
  # Dependabot high: axios inherited-proxy after interceptor cloning
  axios: 1.20.0
  # Dependabot high: adm-zip unbounded memory on crafted ZIP
  adm-zip: 0.6.1
  # Dependabot high: brace-expansion DoS (v1 and v2 lines)
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  # Dependabot high: compression DoS via infinite loop
  compression: 1.8.2
  # Dependabot high: js-yaml quadratic merge-key chains (v3 and v4 lines)
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  # Dependabot high: postcss sourceMappingURL path traversal (no 7.x patch; force 8.x)
  postcss: 8.5.25
  # Dependabot high: nanoid generators can loop indefinitely (GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8)
  nanoid@3: 3.3.19
  # Dependabot critical: proxy-addr unbound CPU during request header parsing
  proxy-addr: 2.0.8
  # Dependabot critical: shell-quote parse() quadratic DoS
  shell-quote: 1.11.0
  # Dependabot high: source-map-js path traversal in sourceRoot
  source-map-js: 1.2.2
  # Dependabot high: fast-uri authority injection & host confusion (CVE-2026-84292, CVE-2026-84394)
  fast-uri: 3.1.8
  # Dependabot high: SVGO removeScripts (CRA still pulls 1.x via @svgr; no SVG imports in app)
  svgo: 2.8.4
  # Dependabot high: browserslist RegExp ReDoS
  browserslist: 4.28.7
  # Dependabot high: webpack-dev-middleware path traversal (GHSA-g84c-rxfj-3j2c; no 5.x patch, CRA's dev server 4.x runs on 7.x)
  webpack-dev-middleware: 7.4.6
  # Dependabot high: node-forge RSA PKCS#1 v1.5 (selfsigned 5.x uses @peculiar/x509 instead)
  selfsigned: 5.5.0
  nth-check: 2.0.1
  wrap-ansi: 7.0.0
  make-dir: 3.1.0
  axios>form-data: 4.0.6
  express: 4.21.0
  jsdom>form-data: 3.0.5
  path-to-regexp: 0.1.13
  rollup: 3.30.0
  semver: 7.5.2
  serialize-javascript: 7.0.5
  tar: 7.5.16
  underscore: 1.13.8

minimumReleaseAgeExclude:
  - dicom-microscopy-viewer@0.48.23 || 0.48.24 || 0.48.25 || 0.48.26 || 0.48.27
  - dicomweb-client@0.11.3
