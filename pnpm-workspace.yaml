shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  core-js: true
  core-js-pure: true
  dicom-microscopy-viewer: true

overrides:
  '@types/d3-dispatch': 3.0.6
  # Dependabot high: axios inherited-proxy after interceptor cloning
  axios: 1.18.0
  # Dependabot high: adm-zip unbounded memory on crafted ZIP
  adm-zip: 0.6.0
  # Dependabot high: brace-expansion DoS (v1 and v2 lines)
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  # Dependabot high: js-yaml quadratic merge-key chains (v3 and v4 lines)
  js-yaml@3: 3.15.1
  js-yaml@4: 4.3.1
  # Dependabot high: postcss sourceMappingURL path traversal (8.x only; keep 7.x for CRA)
  postcss@8: 8.5.25
  # Dependabot high: shell-quote parse() quadratic DoS
  shell-quote: 1.9.0
  # Dependabot high: fast-uri host confusion
  fast-uri: 3.1.4
  # Dependabot high: SVGO removeScripts (CRA still pulls 1.x via @svgr; no SVG imports in app)
  svgo: 2.8.3
  nth-check: 2.0.1
  wrap-ansi: 7.0.0
  make-dir: 3.1.0
  axios>form-data: 4.0.6
  express: 4.21.0
  jsdom>form-data: 3.0.5
  path-to-regexp: 0.1.13
  rollup: 3.30.0
  semver: 7.5.2
  serialize-javascript: 7.0.5
  tar: 7.5.16
  underscore: 1.13.8
