<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Silent renew</title>
  </head>
  <body>
    <!--
      Minimal OIDC silent-renew callback. Loaded in a hidden iframe by
      oidc-client-ts (automaticSilentRenew). Must not boot the React app.
      The vendor bundle is copied from node_modules/oidc-client-ts.
    -->
    <script src="./vendor/oidc-client-ts.min.js"></script>
    <script>
      ;(function () {
        var oidc = window.oidc
        if (!oidc || !oidc.UserManager) {
          console.error('oidc-client-ts failed to load for silent renew')
          return
        }
        // Empty settings: the parent UserManager encoded the request; this
        // page only completes the callback (query for code, fragment for implicit).
        new oidc.UserManager({})
          .signinSilentCallback()
          .catch(function (error) {
            console.error('silent renew callback failed', error)
          })
      })()
    </script>
  </body>
</html>
